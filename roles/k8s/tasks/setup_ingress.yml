---
- name: Preparing the Linux servers for the k8s installation
  tags:
    - never
    - setup_ingress
    - k8s_full_install
  block:
    - name: Install Python kubernetes module dependency
      ansible.builtin.apt:
        name:
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: true

    - name: Deploy MetalLB namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: metallb-system
        state: present

    - name: Check if MetalLB memberlist secret exists
      ansible.builtin.command: >
        kubectl get secret memberlist -n metallb-system
      register: memberlist_secret
      failed_when: false
      changed_when: false

    - name: Create MetalLB memberlist secret if missing
      ansible.builtin.shell: >
        kubectl create secret generic -n metallb-system memberlist --from-literal=secretkey="$(openssl rand -base64 128)"
      when: memberlist_secret.rc != 0

    - name: Apply MetalLB manifest
      kubernetes.core.k8s:
        src: https://raw.githubusercontent.com/metallb/metallb/v0.14.8/config/manifests/metallb-native.yaml
        state: present

    - name: Wait for MetalLB controller deployment rollout
      ansible.builtin.command: >
        kubectl rollout status deployment/controller -n metallb-system --timeout=300s
      changed_when: false

    - name: Wait 10 seconds for MetalLB validating webhook initialization
      ansible.builtin.pause:
        seconds: 10

    - name: Configure MetalLB IP Address Pool
      kubernetes.core.k8s:
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: lan-ip-pool
            namespace: metallb-system
          spec:
            addresses:
              - "{{ metallb_ip_range | default('192.168.8.200-192.168.8.220') }}"
        state: present

    - name: Configure MetalLB L2 Advertisement
      kubernetes.core.k8s:
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: lan-advertisement
            namespace: metallb-system
          spec:
            ipAddressPools:
              - lan-ip-pool
        state: present

    - name: Deploy NGINX Ingress Controller
      kubernetes.core.k8s:
        src: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/cloud/deploy.yaml
        state: present

    - name: Wait for NGINX Ingress Controller rollout
      ansible.builtin.command: >
        kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=300s
      changed_when: false

    - name: Fetch NGINX Ingress Controller service details
      kubernetes.core.k8s_info:
        kind: Service
        name: ingress-nginx-controller
        namespace: ingress-nginx
      register: ingress_service
      until: >
        ingress_service.resources is defined and
        ingress_service.resources | length > 0 and
        ingress_service.resources[0].status.loadBalancer.ingress is defined and
        ingress_service.resources[0].status.loadBalancer.ingress | length > 0
      retries: 30
      delay: 5

    - name: Display assigned Ingress LAN IP
      ansible.builtin.debug:
        msg: "NGINX Ingress Controller is available at LAN IP: {{ ingress_service.resources[0].status.loadBalancer.ingress[0].ip }}"