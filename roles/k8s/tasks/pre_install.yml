# code:language=ansible
---
- name: Preparing the Linux servers for the k8s installation
  tags:
    - never
    - configure_k8s
    - k8s_full_install
  block:
    - name: Install required prerequisites
      ansible.builtin.apt:
        name:
          - containerd
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Disable swap for current session
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb > 0
      changed_when: false

    - name: Remove swap entry from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules load on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Configure sysctl parameters for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Ensuring the /etc/containerd , /etc/apt/keyrings and /usr/lib/cni directory exist in all nodes
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/containerd
        - /etc/apt/keyrings
        - /usr/lib/cni

    - name: Sync /opt/cni/bin binaries to /usr/lib/cni
      ansible.builtin.shell: >
        cp -rn /opt/cni/bin/* /usr/lib/cni/
      args:
        creates: /usr/lib/cni/loopback

    - name: Generate default containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure SystemdCgroup and pause image in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: 'SystemdCgroup = false', replace: 'SystemdCgroup = true' }
        - { regexp: 'sandbox_image = ".*"', replace: 'sandbox_image = "registry.k8s.io/pause:3.10"' }
      notify: Restart containerd
