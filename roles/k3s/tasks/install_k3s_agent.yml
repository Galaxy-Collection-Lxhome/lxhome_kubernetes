---
- name: Installing k3s Agent
  tags:
    - never
    - k3s_full_install
    - k3s_agent_install
  block:
    - name: Check if k3s agent service is active
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_agent_status
      failed_when: false
      changed_when: false

    - name: Print the token
      ansible.builtin.debug:
        msg: "{{ k3s_token_decoded }}"
      when:
        - k3s_token_decoded.content is defined

    - name: Install k3s agent
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_script | default('https://get.k3s.io') }} | K3S_URL={{ k3s_API_server_FQDN }} K3S_TOKEN={{ k3s_node_token }} sh -
      args:
        executable: /bin/bash
      when: k3s_agent_status.rc != 0
      changed_when: true

    - name: Ensure k3s agent is enabled and running
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
