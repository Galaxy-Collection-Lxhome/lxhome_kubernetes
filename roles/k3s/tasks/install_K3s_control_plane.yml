---
- name: Installing k3s control-plane
  tags:
    - never
    - k3s_full_install
    - k3s_init_control_plane
  block:
    - name: Check if k3s control-plane service is active
      ansible.builtin.command: systemctl is-active k3s.service
      register: k3s_control_plane_status
      failed_when: false
      changed_when: false

    - name: Install k3s server
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_script | default('https://get.k3s.io') }} | sh -
      args:
        executable: /bin/bash
      when: k3s_control_plane_status.stdout == 'inactive'
      changed_when: true

    - name: Ensure k3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
